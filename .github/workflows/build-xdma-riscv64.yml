name: Build XDMA for RISC-V

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-riscv64:
    runs-on: neo5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show runner and kernel
        run: |
          set -eux
          uname -a
          test "$(uname -m)" = riscv64

      - name: Prepare kernel build tree
        run: |
          set -euxo pipefail
          running_kernel="$(uname -r)"
          if [[ -d "/lib/modules/${running_kernel}/build" && \
                -f "/lib/modules/${running_kernel}/build/.config" ]]; then
            echo "KERNEL_BUILD=/lib/modules/${running_kernel}/build" >> "${GITHUB_ENV}"
            exit 0
          fi

          sudo apt-get update
          # git is already present on the Neo5 runner; installing it here can
          # conflict with the runner image's Git PPA and git-man package.
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev

          kernel_source="${RUNNER_TEMP}/linux-${running_kernel}"
          base_version="${running_kernel%%-*}"
          git clone --depth 1 --branch "v${base_version}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "${kernel_source}"

          if [[ -r /proc/config.gz ]]; then
            zcat /proc/config.gz > "${kernel_source}/.config"
          elif [[ -r "/boot/config-${running_kernel}" ]]; then
            cp "/boot/config-${running_kernel}" "${kernel_source}/.config"
          else
            make -C "${kernel_source}" ARCH=riscv defconfig
          fi

          make -C "${kernel_source}" ARCH=riscv olddefconfig modules_prepare
          echo "KERNEL_BUILD=${kernel_source}" >> "${GITHUB_ENV}"

      - name: Build kernel module and tools
        run: |
          chmod +x scripts/build-riscv64.sh
          scripts/build-riscv64.sh

      - name: Package build outputs
        run: |
          tar -C build -czf "xdma-riscv64-${GITHUB_SHA}.tar.gz" riscv64
          sha256sum "xdma-riscv64-${GITHUB_SHA}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdma-riscv64-${{ github.sha }}
          path: |
            xdma-riscv64-${{ github.sha }}.tar.gz
            build/riscv64/file.txt
            build/riscv64/xdma.modinfo.txt
          if-no-files-found: error
          retention-days: 14
